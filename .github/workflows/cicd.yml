name: CI/CD

on:
  push:
    branches: [feature/userCreation] # deploy when you push to main
  pull_request:
    branches: [feature/userCreation] # run tests on PRs
  workflow_dispatch:
jobs:
  # -------- CI: run Django tests --------
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11" # change if you use a different version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mysite1/requirements.txt

      - name: Run Django tests
        run: python mysite1/manage.py test

  # -------- CD: build image + push to Docker Hub + deploy --------
  deploy:
    needs: test # only run if tests pass
    if: github.ref == 'refs/heads/feature/userCreation' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # IMPORTANT: this must match the repo:tag your Azure Web App uses
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mysite1-django:v3hub

      - name: Deploy to Azure Web App (container)
        uses: azure/webapps-deploy@v3
        with:
          # CHANGE THIS to your actual web app name in Azure
          app-name: "mysite11"
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: "${{ secrets.DOCKERHUB_USERNAME }}/mysite1-django:v3hub"
